<title>IPP Power Book</title>

<style>
/* Layout: sticky header + tab rail; Map tab = tile-grid map left, state drawer right; other tabs = summary strip then detail tables */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#132029; --muted:#5b6b75; --line:#d9e0e4; --soft:#e9eef1;
  --accent:#0d6b86; --accent-ink:#ffffff; --amber:#b7791f;
  --good:#2f7d4f; --warn:#b7791f; --bad:#b4413a;
  --dem:#2f62b5; --rep:#c0423b; --neutral:#8a979f;
  --s0:#eef3f5; --s1:#cfe2e8; --s2:#9cc6d3; --s3:#5ea3b8; --s4:#2b7b96; --s5:#0d4f66;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --panel:#162128; --ink:#e3eaee; --muted:#93a3ad; --line:#2a3943; --soft:#1d2a32;
  --accent:#4fb3cf; --accent-ink:#0b1418; --amber:#e0a84a;
  --good:#5cb880; --warn:#e0a84a; --bad:#e07069;
  --dem:#6b97e0; --rep:#e0756e; --neutral:#6d7b84;
  --s0:#1b2830; --s1:#1d4050; --s2:#21607a; --s3:#2b86a3; --s4:#4fb3cf; --s5:#9fdcec;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --panel:#162128; --ink:#e3eaee; --muted:#93a3ad; --line:#2a3943; --soft:#1d2a32;
  --accent:#4fb3cf; --accent-ink:#0b1418; --amber:#e0a84a;
  --good:#5cb880; --warn:#e0a84a; --bad:#e07069;
  --dem:#6b97e0; --rep:#e0756e; --neutral:#6d7b84;
  --s0:#1b2830; --s1:#1d4050; --s2:#21607a; --s3:#2b86a3; --s4:#4fb3cf; --s5:#9fdcec;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px 0}
h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.asof{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sample{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px dashed var(--amber);padding:2px 8px;border-radius:3px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
nav .tab{background:none;border:0;border-radius:0;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;padding:9px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav .tab:hover{color:var(--ink)}
nav .tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
nav .tab:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 48px}
section.view{display:flex;flex-direction:column;gap:20px}
[hidden]{display:none!important}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0}
.lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-family:var(--f-mono);font-size:22px;font-weight:500}
.tile .s{font-size:12.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);cursor:default}
th.r,td.r{text-align:right}
table.wrap th{white-space:normal;vertical-align:bottom}
td{padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
td.num,th.num{text-align:right}
tr.grp td{background:var(--soft);font-weight:600}
tbody tr:hover td{background:var(--soft)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.dem{color:var(--dem);border-color:var(--dem)}
.pill.rep{color:var(--rep);border-color:var(--rep)}
.pill.unv{border-style:dashed;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg button{font-family:var(--f-body);font-size:13px;font-weight:600;background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:6px 11px;cursor:pointer}
.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}
.seg button+button{margin-left:-1px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap}
svg text{font-family:var(--f-mono)}
.map svg{width:100%;height:auto;display:block}
.st rect{stroke:var(--panel);stroke-width:2;cursor:pointer;transition:opacity .15s}
.st:hover rect{opacity:.82}
.st.sel rect{stroke:var(--ink);stroke-width:2.5}
.st .ring{fill:none;stroke:var(--amber);stroke-width:2.5;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12.5px;color:var(--muted)}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--f-mono);font-size:13px}
.note{font-size:13px;color:var(--muted);max-width:75ch}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:10px}
.prose p,.prose ul{margin:0}
.prose li{margin-bottom:5px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent)}
.hb{display:flex;gap:3px;align-items:flex-end;height:36px}
.hb i{display:block;width:14px;background:var(--accent);border-radius:2px 2px 0 0}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.edit{border-left:3px solid var(--amber);padding-left:12px}
a{color:var(--accent)}
.src li{font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function drawMap(){
  const W=56,G=4, cols=12, rows=8;
  let h=`<svg viewBox="0 0 ${cols*(W+G)} ${rows*(W+G)}" role="img" aria-label="US tile map coloured by ${METRICS[metric].label}">`;
  for(const [st,[c,r]] of Object.entries(GRID)){
    const x=c*(W+G), y=r*(W+G), f=fillFor(st), tc=textOn(f);
    const held=!!BYSTATE[st];
    let sub="";
    if(metric==="exp") sub=held?`$${f1(BYSTATE[st].exp)}`:"";
    else if(metric==="op") sub=DC[st]?.op?fmt(DC[st].op,1):"";
    else if(metric==="pipe") sub=DC[st]?.pipe?fmt(DC[st].pipe,1):"";
    else if(metric==="g") sub=DC[st]?.g?"▲".repeat(DC[st].g):"";
    else if(metric==="pol") sub=POL[st]?(POL[st].flip?"FLIP":(POL[st].conf?"":"OPEN")):"";
    h+=`<g class="st${st===selState?" sel":""}" data-st="${st}" tabindex="0" role="button" aria-label="${NAMES[st]}">
      <rect x="${x}" y="${y}" width="${W}" height="${W}" rx="5" fill="${f}"></rect>
      ${held?`<rect class="ring" x="${x+3.5}" y="${y+3.5}" width="${W-7}" height="${W-7}" rx="3"></rect>`:""}
      <text x="${x+W/2}" y="${y+24}" text-anchor="middle" font-size="14" font-weight="500" fill="${tc}">${st}</text>
      <text x="${x+W/2}" y="${y+41}" text-anchor="middle" font-size="10" fill="${tc}">${sub}</text></g>`;
  }
  h+="</svg>";
  $("#mapSvg").innerHTML=h;

function rPill(r, kind){ if(!r) return '<span class="note">—</span>'; const sp=kind==="ab"?AB2SP[r]:r; const n=notch(sp); const cls=n<0?"":n<=9?"good":n<=12?"":n<=15?"warn":"bad"; return `<span class="pill ${cls}">${r}</span>`; }

  const v=$("#v-ratings");

  const cmp=(agency,ab)=>{ if(!ab||!agency) return "—"; const d=notch(MOODY[agency]||agency)-notch(AB2SP[ab]); return d<0?`${-d} below`:d>0?`${d} above`:"in line"; };

  const abCols = true ? '<th>AB current</th><th>AB forward</th><th>AB upside</th><th>AB downside</th><th>AB fwd vs. Moody\'s CFR</th><th>AB fwd vs. S&amp;P issuer</th>' : '';

    <div class="tile"><span class="lbl">AB book avg · downside</span><span class="v">${wavg("dn")}</span><span class="s">Weighted by term loan size</span></div>
    <div class="tile"><span class="lbl">AB forward vs. agencies</span><span class="v">${BOOK.credits.filter(c=>/below/.test(vsMoodys(c))).length} below · ${BOOK.credits.filter(c=>/above/.test(vsMoodys(c))).length} above</span><span class="s">vs. Moody's CFR. vs. S&amp;P issuer: ${BOOK.credits.filter(c=>/below/.test(vsSP(c))).length} below · ${BOOK.credits.filter(c=>/above/.test(vsSP(c))).length} above</span></div>

    ${BOOK.credits.map(c=>{const a=c.agency||{}; const ag=r=>r?`<span class="pill ${a.q==="low"?"unv":""}">${r}</span>`:'<span class="note">—</span>';
      const abc = true ? (c.ab?`<td>${rPill(c.ab.cur,"ab")}</td><td>${rPill(c.ab.fwd,"ab")}</td><td>${rPill(c.ab.up,"ab")}</td><td>${rPill(c.ab.dn,"ab")}</td><td class="num">${vsMoodys(c)}</td><td class="num">${vsSP(c)}</td>`:'<td colspan="6" class="note">Not on the AB ratings sheet</td>') : '';
      return `<tr><td>${c.name}</td><td class="num">${c.held?fmt(c.held):"tbc"}</td><td>${ag(a.mc)}</td><td>${ag(a.mt)}</td><td>${ag(a.si)}</td><td>${ag(a.sf)}</td><td class="num">${a.rec||"—"}</td><td>${ag(a.f)}</td>${abc}</tr>`;}).join("")}

        const cs=cush==null?"—":`<span style="color:var(${cush>=3.5?"--good":cush>=2.5?"--ink":"--warn"})">${fmt(cush,1)}x</span>`;
        return `<tr><td>${c.name}</td><td class="num">${c.debt?fmt(c.debt):"—"}</td><td class="num" title="${c.ebALbl}">${c.ebA?fmt(c.ebA):"—"}</td><td class="num">${xx(c.levA)}</td><td class="num" title="${c.ebFLbl}">${c.ebF?fmt(c.ebF):"—"}</td><td class="num">${xx(c.levF)}</td><td class="num" title="${c.multWhy}">${xx(c.mult)}</td><td class="num">${cs}</td><td class="num" title="${c.kwNote}">${kw}</td><td class="note" style="min-width:180px"><b style="color:var(--ink);font-weight:600">${c.policy}</b>${c.levNote&&c.levNote!=="Not disclosed"?`<br>${c.levNote}`:""}</td></tr>`;}).join("")}
      </tbody></table></div>
      <ul class="note" style="margin:0;padding-left:18px">
        <li><b>Leverage</b> = debt / EBITDA (gross, before cash). Debt is the term loan for project names, total debt for Talen, and term loans plus 2034 notes for Alpha Gen. Hover EBITDA for its period.</li>
        <li><b>Cushion</b> = business multiple minus leverage (FY27 where available). Green ≥ 3.5x, amber &lt; 2.5x.</li>
        <li><b>Business multiples are Claude's drafts</b> anchored to 2025–26 PJM gas transactions (LS Power / Constellation and Talen's Freedom / Guernsey purchases, ~$1,150–1,250/kW). Replace them with the desk's view. Hover a multiple for its rationale.</li>
        ${PRIV?"":"<li>Alpha Gen and Pathfinder EBITDA comes from Moody's subscriber reports, so it is on the internal version only.</li>"}
      </ul></div>`;
}

  const tot=rows.filter(c=>c.ltv!=null), wl=tot.reduce((s,c)=>s+c.debt,0)/(tot.reduce((s,c)=>s+c.ev,0)||1);

/* ===================== maturity wall ===================== */
function maturityWall(){
  const facs=[]; BOOK.credits.forEach(c=>c.fac.forEach(f=>{ if(f.mat && f.size) facs.push({c,f}); }));
  const missing=BOOK.credits.flatMap(c=>c.fac.filter(f=>!f.mat||!f.size).map(f=>c.name)).filter((v,i,a)=>a.indexOf(v)===i);
  const yrs={}; facs.forEach(x=>{(yrs[x.f.mat] ||= []).push(x);});
  const ys=Object.keys(yrs).map(Number), span=[];
  for(let y=Math.min(2027,...ys); y<=Math.max(2033,...ys); y++) span.push(y);
  const max=Math.ceil(Math.max(...span.map(y=>(yrs[y]||[]).reduce((s,x)=>s+x.f.size,0)),1)*1.15/500)*500;
  const W=60, H=150, x0=48, top=26, xs=y=>x0+(y-span[0])*W, cliffX=xs(2030)+W-6;
  let svg=`<svg viewBox="0 0 ${x0+span.length*W+10} ${top+H+28}" role="img" aria-label="Term loan size by maturity year" style="width:100%;min-width:460px;height:auto">`;
  svg+=`<rect x="${xs(span[0])}" y="${top}" width="${cliffX-xs(span[0])}" height="${H}" fill="var(--soft)"/>`;
  [0,0.5,1].forEach(f=>{const y=top+H-f*H; svg+=`<line x1="${x0}" x2="${x0+span.length*W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${x0-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(f*max)}</text>`;});
  svg+=`<line x1="${cliffX}" x2="${cliffX}" y1="${top-14}" y2="${top+H}" stroke="var(--amber)" stroke-width="2" stroke-dasharray="4 3"/><text x="${cliffX+5}" y="${top-4}" font-size="10" fill="var(--amber)">First uncapped PJM year (2030/31)</text>`;
  span.forEach(y=>{ let yy=top+H;
    (yrs[y]||[]).sort((a,b)=>b.f.size-a.f.size).forEach((x,i)=>{const h=x.f.size/max*H; yy-=h;
      svg+=`<rect x="${xs(y)+10}" y="${yy}" width="${W-20}" height="${h}" fill="${i%2?"var(--s3)":"var(--accent)"}" stroke="var(--panel)"><title>${x.c.name} ${x.f.n}: $${fmt(x.f.size)}mm</title></rect>`;
      if(h>14) svg+=`<text x="${xs(y)+W/2}" y="${yy+h/2+4}" text-anchor="middle" font-size="9.5" fill="var(--panel)">${x.c.id}</text>`;});
    const tot=(yrs[y]||[]).reduce((s,x)=>s+x.f.size,0);
    if(tot) svg+=`<text x="${xs(y)+W/2}" y="${yy-5}" text-anchor="middle" font-size="10" fill="var(--ink)">$${fmt(tot)}</text>`;
    svg+=`<text x="${xs(y)+W/2}" y="${top+H+16}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${y}</text>`; });
  return `<div class="card"><h3>Maturity wall, term loan size $mm</h3><div class="scroll">${svg}</div>
    <p class="note">Only facilities with a sourced size and maturity are shown. Maturity or size still needed: ${missing.join(", ")}.</p></div>`;
}

const VIEWS={"map":renderMapView,"exposure":renderExposure,"ratings":renderRatings,"capacity":renderCapacity,"hedging":renderHedging,"leverage":renderLeverage,"ltv":renderLTV,"political":renderPolitical,"data-centers":renderDC,"watchlist":renderWatch};
const rendered=new Set();
try{ if(PRIV){ const b=document.getElementById("buildBadge"); b.textContent="Internal · includes Moody's data"; } }catch(_){}
function show(k){
  if(!VIEWS[k]) k="map";
  for(const id of Object.keys(VIEWS)) $("#v-"+id).hidden = id!==k;
  if(!rendered.has(k)){ try{ VIEWS[k](); }catch(e){ $("#v-"+k).innerHTML=`<p class="note">This tab failed to load: ${e.message}</p>`; } rendered.add(k); }
  document.querySelectorAll("#tabs .tab").forEach(b=>b.setAttribute("aria-current", b.dataset.v===k?"page":"false"));
  window.scrollTo(0,0);
}
// Tabs are buttons, not links: the claude.ai viewer intercepts link clicks. Hash is a bookmark only.
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  show(b.dataset.v);
  try{ history.replaceState(null,"","#"+b.dataset.v); }catch(_){}
});
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
let start="map"; try{ start=(location.hash||"#map").slice(1); }catch(_){}
show(start);
</script>
